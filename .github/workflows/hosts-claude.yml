name: Host Claude
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hosts-claude:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline plugin and adapter contracts, no model calls
        shell: pwsh
        run: |
          foreach ($suite in @('Test-ClaudeHooks','Test-1CChangeGate','Test-ClaudeCodeAdapter','Test-CurrentAgentMode')) {
            & pwsh -NoProfile -File "./scripts/$suite.ps1" -PackageRoot (Get-Location).Path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
