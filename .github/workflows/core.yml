name: Core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Core package, isolated host installs and migration
        shell: pwsh
        run: ./scripts/Test-CorePackage.ps1 -PackageRoot (Get-Location).Path
      - name: Deterministic Core contracts
        shell: pwsh
        run: |
          foreach ($suite in @('Test-1CMetadataIndex','Test-1CSpecGrounding','Test-1CStaticDiff','Test-OnboardingExamples')) {
            & pwsh -NoProfile -File "./scripts/$suite.ps1" -PackageRoot (Get-Location).Path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
