name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned OpenSpec test dependency
        shell: pwsh
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd install --global @fission-ai/openspec@1.11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          openspec.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline package checks
        shell: pwsh
        run: ./scripts/Test-BSLFlowPackage.ps1 -PackageRoot .
      - name: Managed host integration contracts without model calls
        shell: pwsh
        run: |
          $suites = @('Test-ADRIndex', 'Test-TaskContext', 'Test-TaskMemory', 'Test-TaskArchitectureBundle', 'Test-TaskResumePilot', 'Test-ProjectArchitectureIndex', 'Test-BSLFlowToolsetSnapshot', 'Test-BSLFlowOpenCodeTransport', 'Test-BSLFlowOpenCodeEvents', 'Test-BSLFlowOpenCodeWorker', 'Test-BSLFlowProcessEnvironment', 'Test-TaskExecutionProfile', 'Test-TaskRuntimePin', 'Test-TaskBudgetGate', 'Test-TaskManagedReview', 'Test-BSLFlowProfiledCodex', 'Test-BFProfiledCodexHostCapability')
          foreach ($suite in $suites) {
            & pwsh -NoProfile -File "./scripts/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $councilSuites = @('Test-CouncilValidation', 'Test-CouncilEngine', 'Test-CouncilTransport', 'Test-CouncilFallback', 'Test-CouncilRouting', 'Test-CouncilCycle', 'Test-CouncilLifecycle')
          foreach ($suite in $councilSuites) {
            & pwsh -NoProfile -File "./global/skills/1c-spec-review/scripts/$suite.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build reproducible executable and run Go tests
        shell: pwsh
        run: ./scripts/Build-BSLFlowCli.ps1 -Test
      - name: Native CLI checks without model or database calls
        shell: pwsh
        run: ./scripts/Test-BSLFlowCli.ps1
