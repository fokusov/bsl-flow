name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline package checks
        shell: pwsh
        env:
          BSL_FLOW_TEST_SHELL: ${{ matrix.shell }}
        run: |
          & $env:BSL_FLOW_TEST_SHELL -NoProfile -File ./scripts/Test-BSLFlowPackage.ps1 -PackageRoot .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build reproducible executable and run Go tests
        shell: pwsh
        run: ./scripts/Build-BSLFlowCli.ps1 -Test
      - name: Native CLI checks without model or database calls
        shell: pwsh
        run: ./scripts/Test-BSLFlowCli.ps1
