version: 2

workflow:
  # Bootstrap selects assisted behavior and does not prove managed host/runtime readiness.
  mode: assisted
  entrypoint: 1c-task
  managed:
    readiness: not_verified_by_bootstrap
    supported_adapters:
      - codex
    guarantee_scope: registered_tasks_through_confirmed_adapter_only
    runtime: requires_explicit_authorized_route_and_target

source:
  paths:
    - src

environment:
  platform_bin: "${ONEC_PLATFORM_BIN}"
  development_db: "${ONEC_DEV_IB}"
  test_db: "${ONEC_TEST_IB}"

test_setup:
  # Agent workflow, not runner arguments or permission to mutate a database.
  policy: inspect_then_install_missing_when_authorized
  yaxunit_directory: 'C:\YAxUnit'
  vanessa_directory: 'C:\vanessa-automation'
  workstation_profile: '${BSL_FLOW_WORKSTATION_PROFILE}'
  development_database_is_test_target: true

verification:
  # Agent policy only, not Unica/v8-runner configuration or environment expansion.
  # enabled=false means not configured; required evidence still cannot be skipped.
  reports_dir: ".bsl-flow/reports"
  evidence_dir: ".bsl-flow/evidence"

  static:
    enabled: true

  unit:
    enabled: false
    provider: yaxunit
    readiness: not_configured

  integration:
    enabled: false
    provider: yaxunit
    readiness: not_configured

  ui:
    enabled: false
    provider: vanessa-automation
    readiness: not_configured
    mcp:
      enabled: false

  smoke:
    enabled: false

policy:
  test_selection: smallest_sufficient
  computer_use: justified_only
  test_database_mode: file_preferred
  # These additive policy fields guide skills; they do not enforce tool permissions.
  require_ui_for_form_changes: true
  require_integration_for_posting_changes: true
  require_independent_review_for_high_risk: true
  max_review_fix_rounds: 1

llm:
  providers:
    openai:
      protocol: openai_responses
      base_url: https://api.openai.com/v1
      token_env: OPENAI_API_KEY
    deepseek:
      protocol: openai_compatible
      base_url: https://api.deepseek.com
      token_env: DEEPSEEK_API_KEY

  models:
    sol:
      provider: openai
      model: gpt-5.6-sol
      effort: medium
    astra:
      provider: openai
      model: gpt-6-astra
      effort: high
    flash:
      provider: deepseek
      model: deepseek-flash
      effort: medium

review:
  enabled: true

  routing:
    s_default: optional
    m_default: required
    l_default: required
    high_risk_override: required

  council:
    enabled: true
    max_parallel: 2
    allow_local_http: false
    # block = explicit legacy opencode config fails with migration blocker.
    # opencode_compat = separate compatibility route outside the API council.
    legacy_mode: block
    roles:
      brainstorm:
        enabled: false
        required: false
        model: astra
        fallback: current_agent
      intent_critic:
        enabled: true
        required: true
        model: flash
        fallback: current_agent
      architecture_critic:
        enabled: true
        required: true
        model: flash
        fallback: current_agent
      executability_critic:
        enabled: true
        required: true
        model: flash
        fallback: current_agent
      chair:
        enabled: true
        required: true
        model: sol
        fallback: current_agent

  permissions:
    # read_search checks project evidence; attached_only is the sealed mode.
    project_read_mode: read_search
    edit: false
    shell: false
    subagents: false
    web: false
    external_directory: false

  input:
    max_file_bytes: 262144

  runtime:
    # DeepSeek V4 Pro/high reviews may legitimately take 5-8 minutes.
    timeout_seconds: 600
    max_output_bytes: 1048576

  thresholds:
    pass_weighted_score: 4.3
    block_below_weighted_score: 3.5
    max_overengineering_index_for_pass: 1
    max_unjustified_ratio_for_pass: 0
